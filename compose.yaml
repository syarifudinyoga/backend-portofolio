services:
  api:
    container_name: portfolio-api
    hostname: api
    image: ghcr.io/${GHCR_NAMESPACE:?Set GHCR_NAMESPACE}/portfolio-backend:${VERSION:-latest}
    env_file:
      - .env
    ports:
      - "127.0.0.1:3004:3004"
    restart: unless-stopped
    networks:
      - portfolio_default

networks:
  portfolio_default:
    name: portfolio_default
    external: true
